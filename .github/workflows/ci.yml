name: aiida-fleur

on: [push, pull_request]

jobs:

  docs:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: docs
            sphinx-options: '' 
            allow-failure: true
          - name: docs-nitpicky
            sphinx-options: '-nW'
            allow-failure: true

    name: ${{ matrix.name }}
    continue-on-error: ${{ matrix.allow-failure }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Cache python dependencies
      id: cache-pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-docs-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          pip-docs-

    - name: Install python dependencies
      run: |
        pip install -e .[docs]

    - name: Build documentation
      env:
        READTHEDOCS: 'True'
        SPHINXOPTS: ${{ matrix.sphinx-options }}
      run: |
        make -C docs html

  pre-commit:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Cache python dependencies
      id: cache-pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-pre-commit-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          pip-pre-commit-

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install python dependencies
      run: |
        pip install .[pre-commit,testing]
        pip freeze

    - name: Run pre-commit
      run: |
        pre-commit run --all-files || (git status --short; git diff ; exit 1)

  tests:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        # aiida-fleur and pyfleur both require Python >=3.10; aiida-core 2.8 supports
        # 3.9-3.13. Every leg is spelled out, because the supported space is no longer a
        # clean cross product: the stored matplotlib/bokeh plot baselines only hold for
        # the pinned versions, and those cannot be installed next to NumPy 2 (matplotlib
        # gained NumPy 2 support in 3.9, well after the pinned 3.6.3).
        include:
          # -- required: the declared floor, and the combination the plot baselines were
          #    generated with
          - python-version: "3.10"
            aiida: {version: 'aiida-core==2.8.0', name: '2.8.0'}
            pyfleur: {version: 'git+https://iffgit.fz-juelich.de/fleur/pyfleur.git@07553a5c31547133c12bb5aec652e2abcd47daaa', name: 'pinned'}
            numpy-version: 'numpy<2'
            bokeh-version: 'bokeh==3.0.3'
            mpl-version: 'matplotlib==3.6.3'
            add-name: ''
            allowed-to-fail: false
          - python-version: "3.11"
            aiida: {version: 'aiida-core', name: 'latest'}
            pyfleur: {version: 'git+https://iffgit.fz-juelich.de/fleur/pyfleur.git@07553a5c31547133c12bb5aec652e2abcd47daaa', name: 'pinned'}
            numpy-version: 'numpy<2'
            bokeh-version: 'bokeh==3.0.3'
            mpl-version: 'matplotlib==3.6.3'
            add-name: ''
            allowed-to-fail: false
          # -- NumPy 2. Allowed to fail only because the plot regressions under
          #    tests/tools/test_plot_fleur still hold matplotlib 3.6.3 images and a
          #    bokeh-3.0.2 baseline; regenerate those and promote these two to required.
          - python-version: "3.12"
            aiida: {version: 'aiida-core', name: 'latest'}
            pyfleur: {version: 'git+https://iffgit.fz-juelich.de/fleur/pyfleur.git@07553a5c31547133c12bb5aec652e2abcd47daaa', name: 'pinned'}
            numpy-version: 'numpy>=2'
            bokeh-version: 'bokeh'
            mpl-version: 'matplotlib'
            add-name: '-numpy2'
            allowed-to-fail: true
          - python-version: "3.13"
            aiida: {version: 'aiida-core', name: 'latest'}
            pyfleur: {version: 'git+https://iffgit.fz-juelich.de/fleur/pyfleur.git@07553a5c31547133c12bb5aec652e2abcd47daaa', name: 'pinned'}
            numpy-version: 'numpy>=2'
            bokeh-version: 'bokeh'
            mpl-version: 'matplotlib'
            add-name: '-numpy2'
            allowed-to-fail: true
          # -- early warning against the development tips
          - python-version: "3.11"
            aiida: {version: 'git+https://github.com/aiidateam/aiida-core.git@main', name: 'main'}
            pyfleur: {version: 'git+https://iffgit.fz-juelich.de/fleur/pyfleur.git@07553a5c31547133c12bb5aec652e2abcd47daaa', name: 'pinned'}
            numpy-version: 'numpy<2'
            bokeh-version: 'bokeh==3.0.3'
            mpl-version: 'matplotlib==3.6.3'
            add-name: ''
            allowed-to-fail: true
          - python-version: "3.11"
            aiida: {version: 'aiida-core', name: 'latest'}
            pyfleur: {version: 'git+https://iffgit.fz-juelich.de/fleur/pyfleur.git@main', name: 'main'}
            numpy-version: 'numpy<2'
            bokeh-version: 'bokeh==3.0.3'
            mpl-version: 'matplotlib==3.6.3'
            add-name: ''
            allowed-to-fail: true

      fail-fast: false

    name: ${{ matrix.python-version }}-aiida-${{ matrix.aiida.name }}-pyfleur-${{ matrix.pyfleur.name }}${{ matrix.add-name }}
    continue-on-error: ${{ matrix.allowed-to-fail }}

    services:
      postgres:
        image: postgres:10
        env:
          POSTGRES_DB: test_${{ matrix.backend }}
          POSTGRES_PASSWORD: ''
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
        - 5432:5432
      rabbitmq:
        image: rabbitmq:latest
        ports:
        - 5672:5672

    steps:
    - uses: actions/checkout@v4

    - name: Cache python dependencies
      id: cache-pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-${{ matrix.python-version }}-${{ matrix.aiida.name }}-tests-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          pip-${{ matrix.python-version }}-${{ matrix.aiida.name }}-tests

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install postgresql

    - name: Install python dependencies
      run: |
        pip install --upgrade wheel setuptools
        pip install git+https://github.com/aiidateam/aiida-testing.git@main
        pip install --no-deps git+https://github.com/aiidateam/aiida-common-workflows.git@master
        pip install .[testing,graphs]
        pip install ${{ matrix.aiida.version }} ${{ matrix.pyfleur.version }}
        # one call so the resolver picks a matplotlib built against the requested numpy
        pip install '${{ matrix.numpy-version }}' ${{ matrix.bokeh-version }} ${{ matrix.mpl-version }}
        python -c "import numpy; print('numpy', numpy.__version__)"

    - name: Run pytest
      run: |
       cd ./tests/
       # create fake codes for tests to work on ci
       touch local_exe/inpgen && chmod +x local_exe/inpgen
       touch local_exe/fleur && chmod +x local_exe/fleur
       ./run_all_cov.sh

    - name: Upload report to Codecov
      uses: codecov/codecov-action@v5
      with:
        file: ./tests/coverage.xml
        fail_ci_if_error: False

    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: matplotlib-comparison-${{ matrix.python-version }}
        path: tests/mpl-results
